name: Godot Client CI

on:
  push:
    paths:
      - "client-godot/**"
      - ".github/workflows/godot.yml"
  pull_request:
    paths:
      - "client-godot/**"

jobs:
  gdunit-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 headless
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install GdUnit4 addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            --repo godot-gdunit-labs/gdUnit4 \
            --pattern "GdUnit4-v*.zip" \
            --output gdunit4.zip \
            --clobber
          mkdir -p client-godot/addons
          unzip -q gdunit4.zip -d client-godot/addons/
          echo "GdUnit4 addon installed:"
          ls client-godot/addons/

      - name: Import Godot project
        run: |
          godot --headless --path client-godot --import 2>&1 || true
          sleep 2

      - name: Run GdUnit4 tests
        run: |
          godot --headless --path client-godot \
            -s addons/gdUnit4/bin/GdUnitCmdTool.gd \
            -- \
            --test-suite res://tests/ \
            2>&1
          echo "Exit code: $?"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: client-godot/reports/
          if-no-files-found: ignore
